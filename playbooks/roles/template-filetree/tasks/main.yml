---

# Render the whole templates/<tapisflavor>/ tree for the calling role in a
# single in-process task. See action_plugins/template_tree.py for the rationale
# (the old per-file `with_community.general.filetree` + `template` loop spent
# ~0.7s/file of pure Ansible overhead). Output is byte-identical to that loop.
- name: 'render {{ calling_rolename }} templates into {{ tapisdir }}/{{ tree_name }}'
  template_tree:
    calling_rolename: '{{ calling_rolename }}'
    tapisflavor: '{{ tapisflavor }}'
    dest: '{{ tapisdir }}/{{ tree_name }}'
